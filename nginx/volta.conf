# Le serveur qui tient la porte.
#
# Un seul conteneur est exposé : il sert le site construit et relaie vers le
# backend ce qui lui revient. Le backend et la base restent sur le réseau privé
# de Docker, sans port publié.
#
# Conséquence heureuse : le navigateur ne voit qu'une seule origine. Il n'y a
# donc aucune requête inter-origines, et la liste VOLTA_CORS_ALLOWED_ORIGINS ne
# sert plus qu'en secours.

upstream volta_backend {
    # Le nom du service dans docker-compose. Docker le résout sur le réseau
    # privé ; aucune adresse n'est écrite en dur.
    server backend:9000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Les photos envoyées par les fournisseurs pèsent jusqu'à 8 Mo, les pièces
    # jointes d'inspection autant. La valeur par défaut de nginx est 1 Mo :
    # au-delà, l'envoi échouait en 413 avant même d'atteindre le backend.
    client_max_body_size 12m;

    # ------------------------------------------------------------------
    # Ce qui part vers le backend
    # ------------------------------------------------------------------

    location /api/ {
        proxy_pass http://volta_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Une inspection lourde ou un contrat de plusieurs pages prend du
        # temps à écrire : soixante secondes évitent de couper une opération
        # qui aboutissait.
        proxy_read_timeout 60s;
    }

    # Les photos d'engins NE SONT PAS sous /api.
    #
    # EquipmentPhotoController renvoie « /uploads/equipment/{uuid}.jpg », chemin
    # nu que le navigateur résout sur l'origine du site. Sans cette règle, tout
    # engin dont la photo a été téléversée s'affiche cassé — le catalogue entier
    # pour une plateforme qui tourne depuis quelques semaines.
    location /uploads/ {
        proxy_pass http://volta_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Un fichier téléversé ne change jamais : son nom est un UUID. Le
        # navigateur peut le garder, et le backend cesse d'être sollicité pour
        # redonner la même image à chaque page.
        #
        # Spring Security pose « no-store » sur tout ce qu'il sert, y compris
        # ces images. Transmis tel quel, cet en-tête s'ajoutait au nôtre et la
        # réponse en portait deux, contradictoires. Celui de l'amont est donc
        # retiré avant que le nôtre soit posé.
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_hide_header Expires;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # Sonde de santé, pour Docker et pour un service de supervision.
    location = /actuator/health {
        proxy_pass http://volta_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    # ------------------------------------------------------------------
    # Ce que nginx sert lui-même
    # ------------------------------------------------------------------

    # Un seul en-tête de cache par emplacement.
    #
    # La directive « expires » pose son propre Cache-Control, auquel
    # « add_header » en ajoutait un second : la réponse en portait deux, de
    # contenus différents. Les navigateurs s'en accommodent, les caches
    # intermédiaires pas toujours, et personne ne peut dire lequel fait foi.
    #
    # Les fichiers d'assets portent une empreinte dans leur nom : un contenu
    # modifié change de nom. Ils peuvent donc être gardés un an sans risque de
    # servir une version périmée.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /engins/ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Le service worker ne doit JAMAIS être gardé en cache.
    #
    # Il décide lui-même de ce qui est gardé : une copie périmée continuerait de
    # servir l'ancienne application longtemps après le déploiement, et
    # l'utilisateur n'aurait aucun moyen de s'en défaire.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Toute autre adresse rend l'application.
    #
    # Les routes de react-router n'existent pas sur le disque : « /admin/demandes »
    # n'est pas un fichier. Sans ce repli, ouvrir une adresse profonde ou
    # rafraîchir la page donne un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Compression : le JavaScript d'une application de cette taille passe de
    # plusieurs mégaoctets à quelques centaines de kilooctets, ce qui compte sur
    # une connexion mobile de chantier.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;
}
