spring.application.name=volta-backend
server.port=9000

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/volta?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Le schéma est créé et mis à jour par Hibernate en développement : le projet
# n'embarque aucun outil de migration, et « none » laissait une base vide sur
# laquelle l'application échouait au démarrage.
# En production, DDL_AUTO doit valoir « validate » ou « none », le schéma étant
# alors géré hors de l'application.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

# Dialecte explicite : le serveur local est MariaDB, qu'Hibernate traitait
# comme un MySQL générique. Il générait alors « SELECT ... FOR UPDATE OF alias »
# pour le verrou pessimiste, syntaxe que MariaDB refuse — l'acceptation d'un
# devis échouait sur une erreur SQL présentée comme un défaut d'authentification.
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MariaDBDialect}

volta.session.duration-days=${SESSION_DURATION_DAYS:7}
