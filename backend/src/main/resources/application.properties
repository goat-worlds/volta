spring.application.name=volta-backend

# Le port est imposé par l'hébergeur : Render, comme la plupart, le transmet par
# la variable PORT et sonde ce port-là. Codé en dur, le service écoutait
# ailleurs que là où on l'attendait et le déploiement était déclaré en échec.
# Sans la variable, le comportement local reste inchangé.
server.port=${PORT:9000}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/volta?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Le schéma est créé et mis à jour par Hibernate en développement : le projet
# n'embarque aucun outil de migration, et « none » laissait une base vide sur
# laquelle l'application échouait au démarrage.
# En production, DDL_AUTO doit valoir « validate » ou « none », le schéma étant
# alors géré hors de l'application.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

# Dialecte explicite : le serveur local est MariaDB, qu'Hibernate traitait
# comme un MySQL générique. Il générait alors « SELECT ... FOR UPDATE OF alias »
# pour le verrou pessimiste, syntaxe que MariaDB refuse — l'acceptation d'un
# devis échouait sur une erreur SQL présentée comme un défaut d'authentification.
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MariaDBDialect}

volta.session.duration-days=${SESSION_DURATION_DAYS:7}

# Jeu de démonstration : comptes et catalogue d'essai. Actif en développement,
# où il évite de saisir un jeu de test à la main. Le profil d'hébergement le
# coupe, et le défaut côté code est « false » — une instance qui ne dit rien
# n'amorce rien.
volta.seed.demo=${VOLTA_SEED_DEMO:true}

# Supervision : seul l'état de santé est exposé, pour le sondage de l'hébergeur
# et du service de monitoring. Les autres points d'Actuator — variables
# d'environnement, configuration, métriques — renseigneraient un attaquant sur
# l'installation.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
# Le détail des composants (base de données, disque) n'est pas public : un
# sondage n'a besoin que du statut global.
management.endpoint.health.show-details=never
