spring.application.name=volta-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/volta?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USER:volta}
spring.datasource.password=${DB_PASSWORD:volta}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

volta.session.duration-days=${SESSION_DURATION_DAYS:7}
