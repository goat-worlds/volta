# Profil d'hébergement Render.
#
# Activé par SPRING_PROFILES_ACTIVE=render, il ne s'applique qu'en ligne : le
# développement local garde MySQL et n'est pas touché par ce fichier.
#
# L'hôte, le port et le nom de base arrivent séparément et l'URL se compose ici :
# ni un blueprint Render ni le tableau de bord d'un fournisseur de base ne
# donnent d'URL JDBC toute faite.
#
# Le mode TLS est réglable parce que la base n'est pas forcément chez
# l'hébergeur du service. « prefer », défaut du pilote, chiffre si le serveur le
# propose et se rabat sur du clair sinon. Une base joignable par l'Internet
# public — c'est le cas de Neon — doit recevoir « require », qui refuse la
# connexion plutôt que de la laisser passer en clair.
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=${PGSSLMODE:prefer}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Le projet n'embarque aucun outil de migration : sur une base fraîchement
# provisionnée, Hibernate doit créer le schéma au premier démarrage, sans quoi
# l'application démarre sur des tables absentes.
#
# Une fois le schéma en place et stable, passer DDL_AUTO à « validate » dans les
# variables du service : Hibernate vérifiera alors la correspondance sans jamais
# modifier la base.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# Aucun compte de démonstration en ligne. Leur mot de passe est écrit en clair
# dans les sources d'un dépôt public : sur une instance accessible, ils
# donneraient un accès administrateur à quiconque connaît le projet.
volta.seed.demo=false
