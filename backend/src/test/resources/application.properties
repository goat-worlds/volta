# Configuration des tests.
#
# ATTENTION — ce fichier ne complète pas src/main/resources/application.properties,
# il le REMPLACE : Spring Boot retient le premier application.properties du
# classpath, et celui des tests passe devant. Toute propriété sans valeur par
# défaut dans le code doit donc être redonnée ici, sous peine de voir le
# contexte refuser de démarrer et TOUS les tests qui le chargent échouer d'un
# coup, sur une erreur qui ne nomme que la première propriété manquante.

spring.datasource.url=jdbc:h2:mem:volta-test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Dialecte aligné sur la base de test. Sans cette ligne, Hibernate héritait du
# MariaDBDialect prévu pour le serveur de développement, alors que les tests
# tournent sur H2 en mode MySQL.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Les deux seules propriétés que le code exige sans valeur de repli
# (UploadConfig, EquipmentPhotoController, InspectionFileController). Elles
# pointent sous target/, que `mvn clean` efface : les fichiers écrits par un
# test ne se déposent pas dans l'arborescence des sources et ne survivent pas
# d'une exécution à l'autre.
app.upload-dir=target/test-uploads/equipment
app.inspection-upload-dir=target/test-uploads/inspections

# Pas de jeu de démonstration : chaque test compose les données dont il a
# besoin, et un catalogue préchargé rendrait les comptages imprévisibles.
volta.seed.demo=false
