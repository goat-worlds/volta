<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      VOLTA s'installe : le manifeste dit au navigateur sous quel nom, avec
      quelle icone et dans quelle couleur poser l'application sur l'ecran
      d'accueil. iOS ne le lit pas et reclame ses propres balises.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b1f3a" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VOLTA" />
    <title>VOLTA — Engins de chantier vérifiés, Côte d'Ivoire</title>
    <meta
      name="description"
      content="Louer, acheter, faire vérifier un engin de chantier en Côte d'Ivoire. Chaque machine est inspectée sur place par Génie Sélect avant d'être proposée."
    />

    <!--
      L'aperçu des liens partagés.

      Une adresse collée dans WhatsApp, Facebook ou LinkedIn n'affichait qu'un
      texte nu : aucune de ces applications ne lit le manifeste ni le favicon.
      Elles cherchent les balises og:*, et à défaut ne montrent rien — un lien
      sans vignette passe pour douteux là où le partage se fait de main en main.

      Les adresses sont ABSOLUES, et doivent l'être : un lecteur d'aperçu
      n'exécute pas la page et ne résout pas « /og-volta.png » contre quoi que
      ce soit. Un chemin relatif ici ne rend aucune image.

      L'image fait 1200 × 630 sur fond blanc, comme la barre de navigation du
      site. Elle est produite par outils/apercu-partage.py, à relancer après
      toute modification du logo.
    -->
    <link rel="canonical" href="https://www.voltaci.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VOLTA" />
    <meta property="og:locale" content="fr_CI" />
    <meta property="og:url" content="https://www.voltaci.com/" />
    <meta property="og:title" content="VOLTA — Engins de chantier vérifiés, Côte d'Ivoire" />
    <meta
      property="og:description"
      content="Louer, acheter, faire vérifier un engin de chantier en Côte d'Ivoire. Chaque machine est inspectée sur place par Génie Sélect avant d'être proposée."
    />
    <meta property="og:image" content="https://www.voltaci.com/og-volta.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <!-- Le texte que lit une personne aveugle quand l'aperçu s'affiche. -->
    <meta property="og:image:alt" content="Logo VOLTA : un V orange portant une pelle hydraulique, et la devise Acheter, Louer, Avancez." />

    <!--
      X et les applications qui suivent sa convention. « summary_large_image »
      donne la vignette pleine largeur ; sans cette ligne, l'image est réduite
      à une miniature carrée où le logo devient illisible.
    -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VOLTA — Engins de chantier vérifiés, Côte d'Ivoire" />
    <meta
      name="twitter:description"
      content="Louer, acheter, faire vérifier un engin de chantier en Côte d'Ivoire. Chaque machine est inspectée sur place par Génie Sélect avant d'être proposée."
    />
    <meta name="twitter:image" content="https://www.voltaci.com/og-volta.png" />

    <!--
      Barlow : dessinée pour la signalétique des infrastructures publiques —
      grotesque basse en contraste, légèrement arrondie. C'est la lettre des
      panneaux de chantier et des flancs d'engins, pas celle d'un tableau de
      bord. La condensée porte les titres, la normale le texte courant.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
