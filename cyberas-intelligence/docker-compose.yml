services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/cyberas
      QUARKUS_DATASOURCE_USERNAME: cyberas
      QUARKUS_DATASOURCE_PASSWORD: cyberas
      QUARKUS_REDIS_HOSTS: redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      QUARKUS_OIDC_TENANT_ENABLED: "false"
    depends_on:
      - db
      - redis
      - kafka

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cyberas
      POSTGRES_USER: cyberas
      POSTGRES_PASSWORD: cyberas
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"

volumes:
  pgdata:
