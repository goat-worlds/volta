# Publication des images Docker de VOLTA.
#
# ci.yml vérifie et ne publie rien. Ce workflow-ci construit les deux images et
# les pousse sur GHCR, d'où le VPS les récupère. Docker Manager ne sait pas
# cloner un dépôt : sans registre, il n'y aurait rien à déployer.
#
# Déclenché à la main, ou sur une étiquette de version. Pas sur chaque poussée :
# republier à chaque commit écraserait « latest » sous du code non relu, et le
# VPS le récupérerait au prochain redémarrage.

name: Images Docker

on:
  workflow_dispatch:
    inputs:
      etiquette:
        description: "Étiquette à publier en plus de « latest » (ex. 1.0.0)"
        required: false
        default: ""
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io

jobs:
  images:
    name: Construire et publier
    runs-on: ubuntu-latest

    # Écriture sur le registre du dépôt : c'est le seul droit supplémentaire
    # demandé, et GITHUB_TOKEN suffit — aucun secret à créer.
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - nom: volta-backend
            contexte: ./backend
            dockerfile: ./backend/Dockerfile
          - nom: volta-frontend
            contexte: .
            dockerfile: ./Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Se connecter à GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Le nom du propriétaire doit être en minuscules : GHCR refuse une
      # référence qui n'en est pas, et « goat-worlds » l'est déjà — mais un
      # dépôt transféré sous un autre compte casserait silencieusement.
      - name: Normaliser le nom du dépôt
        id: ref
        run: echo "image=${REGISTRY}/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/${{ matrix.nom }}" >> "$GITHUB_OUTPUT"

      - name: Étiquettes
        id: etiquettes
        run: |
          liste="${{ steps.ref.outputs.image }}:latest"
          if [ -n "${{ inputs.etiquette }}" ]; then
            liste="$liste,${{ steps.ref.outputs.image }}:${{ inputs.etiquette }}"
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            liste="$liste,${{ steps.ref.outputs.image }}:${GITHUB_REF_NAME#v}"
          fi
          echo "liste=$liste" >> "$GITHUB_OUTPUT"

      - name: Construire et pousser
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexte }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.etiquettes.outputs.liste }}
          # Le cache du registre évite de recompiler Maven et Vite de zéro à
          # chaque publication.
          cache-from: type=gha
          cache-to: type=gha,mode=max
